services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://web:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: ./backend
    image: resume_screener_backend:latest
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    env_file:
      - ./backend/.env
    environment:
      - HF_HUB_OFFLINE=0
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
    volumes:
      - resumes_data:/app/resumes
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    image: resume_screener_backend:latest # Uses identical prebuilt image
    command: celery -A config worker --concurrency=3 --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - HF_HUB_OFFLINE=0
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - REDIS_URL=redis://redis:6379/1
      - REDIS_HOST=redis
    volumes:
      - resumes_data:/app/resumes # Worker reads the exact same disk
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  resumes_data: # Declares shared named volume
